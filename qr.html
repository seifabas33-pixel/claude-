<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moaz Moamen — QR Code | Larimar Port Ghalib</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f0ede8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 48px 40px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      position: relative;
      overflow: hidden;
    }

    /* top wave decoration */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, #184C72, #DB5E2B, #05A8C1);
    }

    .logo {
      height: 44px;
      margin: 0 auto 6px;
      object-fit: contain;
    }

    .brand-sub {
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #DB5E2B;
      font-weight: 600;
      margin-bottom: 28px;
    }

    .divider {
      height: 1px;
      background: #e8e4df;
      margin-bottom: 28px;
    }

    .agent-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.7rem;
      font-weight: 700;
      color: #184C72;
      margin-bottom: 4px;
    }

    .agent-title {
      font-size: 0.82rem;
      color: #DB5E2B;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    /* QR code wrapper */
    .qr-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      border-radius: 16px;
      border: 2px solid #e8e4df;
      background: #fff;
      margin-bottom: 24px;
      position: relative;
    }
    /* corner accents */
    .qr-wrap::before, .qr-wrap::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      border-color: #DB5E2B;
      border-style: solid;
    }
    .qr-wrap::before { top: 6px; left: 6px; border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
    .qr-wrap::after  { bottom: 6px; right: 6px; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

    #qrcode canvas, #qrcode img { border-radius: 8px; }

    .scan-label {
      font-size: 0.8rem;
      color: #999;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
      margin-bottom: 28px;
    }

    .url-chip {
      display: inline-block;
      background: #f8f6f3;
      border: 1px solid #e8e4df;
      border-radius: 100px;
      padding: 8px 18px;
      font-size: 0.78rem;
      color: #025B88;
      font-weight: 500;
      margin-bottom: 32px;
      word-break: break-all;
    }

    .contact-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 32px;
    }
    .contact-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.88rem;
      color: #184C72;
      font-weight: 500;
    }
    .contact-item svg { width: 16px; height: 16px; color: #DB5E2B; flex-shrink: 0; }
    .whatsapp-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #25D366;
      color: white;
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
    }
    .whatsapp-chip svg { width: 18px; height: 18px; }

    .tagline {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 0.92rem;
      color: #aaa;
      margin-top: 24px;
    }

    /* print button */
    .print-btn {
      margin-top: 32px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #184C72;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: background 0.2s;
    }
    .print-btn:hover { background: #025B88; }
    .print-btn svg { width: 18px; height: 18px; }

    @media print {
      body { background: white; padding: 0; }
      .card { box-shadow: none; border: 1px solid #ddd; }
      .print-btn { display: none; }
    }

    @media (max-width: 480px) {
      .card { padding: 36px 24px 32px; }
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="https://larimar-resort.com/wp-content/uploads/2024/10/larimar-logo-orange-png.png" alt="Larimar" class="logo" />
    <p class="brand-sub">Port Ghalib · Red Sea, Egypt</p>
    <div class="divider"></div>
    <h1 class="agent-name">Moaz Moamen</h1>
    <p class="agent-title">Sales Agent</p>

    <div class="qr-wrap">
      <div id="qrcode"></div>
    </div>
    <p class="scan-label">Scan to view portfolio</p>

    <div class="contact-row">
      <div class="contact-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.55 9.81a19.79 19.79 0 01-3.07-8.67A2 2 0 012.46 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 9.43a16 16 0 006.66 6.66l.8-.8a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
        +20 103 529 9659
      </div>
      <div class="contact-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        m.moamen@larimar-resort.com
      </div>
    </div>

    <a href="https://wa.me/201035299659" class="whatsapp-chip">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      WhatsApp Moaz
    </a>

    <p class="tagline">"Where The Soul Finds Serenity"</p>

    <button class="print-btn" onclick="window.print()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Print / Save as PDF
    </button>
  </div>

  <script>
    new QRCode(document.getElementById('qrcode'), {
      text: 'https://seifabas33-pixel.github.io/claude-/',
      width: 220,
      height: 220,
      colorDark: '#184C72',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>

</body>
</html>
