<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Youssef Osama | Senior Sales · Port Ghalib</title>

  <!-- WhatsApp / Social Preview -->
  <meta property="og:title" content="Youssef Osama — Senior Sales" />
  <meta property="og:description" content="Senior Sales · Port Ghalib · Red Sea, Egypt. Tap to call, email, or chat on WhatsApp." />
  <meta property="og:image" content="https://seifabas33-pixel.github.io/claude-/assets/youssef-osama.jpg" />
  <meta property="og:url" content="https://seifabas33-pixel.github.io/claude-/card-youssef.html" />
  <meta property="og:type" content="profile" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Youssef Osama — Senior Sales · Port Ghalib" />
  <meta name="twitter:description" content="Senior Sales · Port Ghalib · Red Sea, Egypt" />
  <meta name="twitter:image" content="https://seifabas33-pixel.github.io/claude-/assets/youssef-osama.jpg" />

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background:
        radial-gradient(ellipse at 50% 0%, rgba(2,91,136,0.22) 0%, transparent 60%),
        #0a0f1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      font-family: 'Inter', sans-serif;
    }

    /* ===== CARD ===== */
    .card {
      width: 100%;
      max-width: 380px;
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(160deg, #0d1829 0%, #0f2240 45%, #0a1628 100%);
      box-shadow: 0 24px 70px rgba(0,0,0,0.55);
      padding: 30px 26px 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: card-enter 0.8s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes card-enter {
      from { opacity: 0; transform: translateY(28px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Soft glow accents inside the card */
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 18% 12%, rgba(2,91,136,0.20) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 8%, rgba(219,94,43,0.14) 0%, transparent 50%);
      pointer-events: none;
    }

    /* Corner brackets */
    .corner {
      position: absolute;
      width: 22px; height: 22px;
      border-color: #DB5E2B;
      border-style: solid;
      opacity: 0.75;
    }
    .corner-tl { top: 12px; left: 12px; border-width: 2px 0 0 2px; border-radius: 4px 0 0 0; }
    .corner-tr { top: 12px; right: 12px; border-width: 2px 2px 0 0; border-radius: 0 4px 0 0; }
    .corner-bl { bottom: 12px; left: 12px; border-width: 0 0 2px 2px; border-radius: 0 0 0 4px; }
    .corner-br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; border-radius: 0 0 4px 0; }

    .top-line {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #DB5E2B, #05A8C1, transparent);
    }

    /* ===== EYEBROW ===== */
    .eyebrow {
      position: relative;
      z-index: 1;
      font-size: 0.62rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      font-weight: 500;
      margin-bottom: 18px;
    }

    /* ===== PHOTO ===== */
    .photo-frame {
      position: relative;
      z-index: 1;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 2px solid rgba(219,94,43,0.45);
    }
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 12%;
      transform: scale(1.55);
      transform-origin: 50% 20%;
      display: block;
    }
    .photo-initials {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #0f2240 0%, #0a1628 100%);
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 700;
      color: #DB5E2B;
    }

    /* ===== NAME / TITLE ===== */
    .name {
      position: relative;
      z-index: 1;
      font-family: 'Playfair Display', serif;
      font-size: 1.85rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.12;
      margin-top: 16px;
      letter-spacing: 0.02em;
    }
    .name span { color: #DB5E2B; }

    .diamond {
      position: relative;
      z-index: 1;
      width: 7px; height: 7px;
      background: #DB5E2B;
      transform: rotate(45deg);
      margin: 12px 0 10px;
    }

    .title {
      position: relative;
      z-index: 1;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
    }
    .subtitle {
      position: relative;
      z-index: 1;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.98rem;
      color: rgba(255,255,255,0.4);
      font-style: italic;
      font-weight: 300;
      margin-top: 4px;
    }

    .divider {
      position: relative;
      z-index: 1;
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(219,94,43,0.6), transparent);
      margin: 18px 0;
    }

    /* ===== CONTACT ROWS ===== */
    .contacts {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .contact {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: all 0.2s ease;
    }
    .contact:hover { background: rgba(255,255,255,0.08); border-color: rgba(219,94,43,0.4); }
    .contact .ic {
      width: 34px; height: 34px;
      flex-shrink: 0;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(219,94,43,0.14);
    }
    .contact .ic svg { width: 16px; height: 16px; }
    .contact.call .ic svg, .contact.mail .ic svg { color: #DB5E2B; }
    .contact.wa .ic { background: rgba(37,211,102,0.14); }
    .contact.wa .ic svg { color: #25D366; }
    .contact .txt { text-align: left; line-height: 1.25; }
    .contact .txt small {
      display: block;
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }

    /* ===== QR ===== */
    .qr-section {
      position: relative;
      z-index: 1;
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .qr-box {
      padding: 11px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 0 30px rgba(219,94,43,0.18);
      line-height: 0;
    }
    .qr-box img, .qr-box canvas, .qr-box #qrcode { display: block; }
    .qr-caption {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.88rem;
      color: rgba(255,255,255,0.4);
    }

    /* ===== SAVE CONTACT ===== */
    .save-btn {
      position: relative;
      z-index: 1;
      margin-top: 18px;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 14px;
      border-radius: 12px;
      background: #DB5E2B;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .save-btn:hover { background: #c0521f; transform: translateY(-1px); }
    .save-btn svg { width: 17px; height: 17px; }

    .footer-note {
      margin-top: 16px;
      font-size: 0.66rem;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.22);
      text-align: center;
    }

    @media print {
      body { background: #fff; }
      .save-btn { display: none; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="top-line"></div>
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="eyebrow">Port Ghalib · Red Sea · Egypt</div>

    <div class="photo-frame">
      <div class="photo-initials" id="photoInitials">YO</div>
      <img src="assets/youssef-osama.jpg" alt="Youssef Osama"
           id="photoImg" style="display:none"
           onload="this.style.display='block';document.getElementById('photoInitials').style.display='none';" />
    </div>

    <h1 class="name">Youssef <span>Osama</span></h1>
    <div class="diamond"></div>
    <div class="title">Senior Sales</div>

    <div class="divider"></div>

    <div class="contacts">

        <span class="txt"><small>Call</small>+20 111 564 3691</span>

        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
        <span class="txt"><small>Email</small>youssef.yo40@gmail.com</span>

        <span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884"/></svg></span>

    <div class="qr-section">
      <div class="qr-box"><img src="assets/youssef-qr.png" alt="QR code to Youssef Osama's card" width="132" height="132" /></div>
      <div class="qr-caption">Scan to open &amp; share my card</div>
    </div>

    <button class="save-btn" id="saveContact">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      Save to Contacts
    </button>

    <div class="footer-note">Youssef Osama · Senior Sales</div>
  </div>

  <script>
    // Save Contact → downloads a vCard (.vcf)
    document.getElementById('saveContact').addEventListener('click', function () {
      var vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'N:Osama;Youssef;;;',
        'FN:Youssef Osama',
        'TITLE:Senior Sales',
        'TEL;TYPE=CELL,VOICE:+201115643691',
        'EMAIL;TYPE=INTERNET:youssef.yo40@gmail.com',
        'ADR;TYPE=WORK:;;Port Ghalib;Red Sea;;;Egypt',
        'URL:https://seifabas33-pixel.github.io/claude-/card-youssef.html',
        'END:VCARD'
      ].join('\r\n');
      var blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
      var link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'Youssef-Osama.vcf';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    });
  </script>

</body>
</html>
