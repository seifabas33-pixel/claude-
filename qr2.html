<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mohamed Sharawi — QR Code | Larimar Port Ghalib</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f0ede8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 48px 40px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, #184C72, #DB5E2B, #05A8C1);
    }

    .logo {
      height: 44px;
      margin: 0 auto 6px;
      object-fit: contain;
    }

    .brand-sub {
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #DB5E2B;
      font-weight: 600;
      margin-bottom: 28px;
    }

    .divider {
      height: 1px;
      background: #e8e4df;
      margin-bottom: 28px;
    }

    /* Agent photo */
    .agent-photo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      border: 3px solid #DB5E2B;
      margin: 0 auto 14px;
      display: block;
      box-shadow: 0 4px 16px rgba(219,94,43,0.2);
    }

    .agent-photo-placeholder {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e8e0d8, #d4c9bc);
      border: 3px solid #DB5E2B;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: #aaa;
      font-weight: 500;
    }

    .agent-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.7rem;
      font-weight: 700;
      color: #184C72;
      margin-bottom: 4px;
    }

    .agent-title {
      font-size: 0.82rem;
      color: #DB5E2B;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .qr-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      border-radius: 16px;
      border: 2px solid #e8e4df;
      background: #fff;
      margin-bottom: 24px;
      position: relative;
    }
    .qr-wrap::before, .qr-wrap::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      border-color: #DB5E2B;
      border-style: solid;
    }
    .qr-wrap::before { top: 6px; left: 6px; border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
    .qr-wrap::after  { bottom: 6px; right: 6px; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

    #qrcode canvas, #qrcode img { border-radius: 8px; }

    .scan-label {
      font-size: 0.8rem;
      color: #999;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
      margin-bottom: 28px;
    }

    .contact-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 32px;
    }
    .contact-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.88rem;
      color: #184C72;
      font-weight: 500;
    }
    .contact-item svg { width: 16px; height: 16px; color: #DB5E2B; flex-shrink: 0; }

    .whatsapp-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #25D366;
      color: white;
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
    }
    .whatsapp-chip svg { width: 18px; height: 18px; }

    .tagline {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 0.92rem;
      color: #aaa;
      margin-top: 24px;
    }

    .print-btn {
      margin-top: 32px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #184C72;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: background 0.2s;
    }
    .print-btn:hover { background: #025B88; }
    .print-btn svg { width: 18px; height: 18px; }

    @media print {
      body { background: white; padding: 0; }
      .card { box-shadow: none; border: 1px solid #ddd; }
      .print-btn { display: none; }
    }

    @media (max-width: 480px) {
      .card { padding: 36px 24px 32px; }
    }
  </style>
</head>
