<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,400&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #ecdfca;
    overflow: hidden;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .poster {
    width: 1080px;
    height: 1920px;
    flex: 0 0 auto;
    transform-origin: center center;
    position: relative;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    background:
      radial-gradient(ellipse at 50% -5%, #ffffff 0%, #f6efe4 45%, #ecdfca 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 130px 90px 120px;
    text-align: center;
  }

  /* Decorative frame */
  .frame {
    position: absolute;
    inset: 48px;
    border: 2px solid rgba(12,37,69,0.18);
    border-radius: 34px;
    pointer-events: none;
  }
  .frame::before {
    content: '';
    position: absolute;
    inset: 12px;
    border: 1px solid rgba(219,94,43,0.35);
    border-radius: 24px;
  }

  .accent-bar {
    width: 104px;
    height: 6px;
    border-radius: 4px;
    background: linear-gradient(90deg, #DB5E2B, #0c2545);
    z-index: 1;
  }

  .eyebrow {
    z-index: 1;
    font-size: 25px;
    letter-spacing: 0.44em;
    text-transform: uppercase;
    color: #0c2545;
    font-weight: 600;
    opacity: 0.7;
    margin-top: 34px;
    padding-left: 0.44em;
  }

  /* Photo */
  .photo {
    z-index: 1;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    overflow: hidden;
    border: 6px solid #fff;
    box-shadow: 0 22px 60px rgba(12,37,69,0.28), 0 0 0 2px rgba(219,94,43,0.4);
    margin-top: 58px;
  }
  .photo img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 12%;
    transform: scale(1.5);
    transform-origin: 50% 18%;
  }

  .name {
    z-index: 1;
    font-family: 'Playfair Display', serif;
    font-size: 96px;
    font-weight: 800;
    color: #0c2545;
    line-height: 1.04;
    margin-top: 46px;
    letter-spacing: 0.01em;
  }
  .name span { color: #DB5E2B; }

  .role {
    z-index: 1;
    font-size: 31px;
    font-weight: 600;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #0c2545;
    opacity: 0.75;
    margin-top: 24px;
    padding-left: 0.32em;
  }
  .place {
    z-index: 1;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 42px;
    color: #8a6a45;
    margin-top: 10px;
  }

  /* QR block */
  .qr-wrap {
    z-index: 1;
    margin-top: 64px;
    background: #fff;
    padding: 38px;
    border-radius: 34px;
    box-shadow: 0 26px 70px rgba(12,37,69,0.22);
    position: relative;
  }
  .qr-wrap::after {
    content: '';
    position: absolute;
    inset: 16px;
    border: 2px dashed rgba(12,37,69,0.12);
    border-radius: 22px;
    pointer-events: none;
  }
  .qr-wrap img { display: block; width: 460px; height: 460px; }

  .scan {
    z-index: 1;
    margin-top: 54px;
    display: flex;
    align-items: center;
    gap: 22px;
    font-family: 'Playfair Display', serif;
    font-size: 58px;
    font-weight: 700;
    color: #DB5E2B;
    letter-spacing: 0.05em;
  }
  .scan svg { width: 54px; height: 54px; color: #DB5E2B; }

  .scan-sub {
    z-index: 1;
    margin-top: 14px;
    font-size: 30px;
    color: #0c2545;
    opacity: 0.6;
    letter-spacing: 0.04em;
  }

  /* Bottom contact strip */
  .contact-strip {
    z-index: 1;
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 34px;
    font-size: 33px;
    font-weight: 600;
    color: #0c2545;
  }
  .contact-strip .dot { width: 8px; height: 8px; border-radius: 50%; background: #DB5E2B; }
  .contact-strip svg { width: 30px; height: 30px; vertical-align: -5px; margin-right: 12px; color: #DB5E2B; }
</style>
</head>
<body>
  <div class="poster">
    <div class="frame"></div>

    <div class="accent-bar"></div>
    <div class="eyebrow">Port Ghalib · Red Sea</div>

    <div class="photo"><img src="assets/youssef-osama.jpg" alt="Youssef Osama" /></div>

    <div class="name">Youssef <span>Osama</span></div>
    <div class="role">Senior Sales</div>
    <div class="place">Port Ghalib · Red Sea, Egypt</div>

    <div class="qr-wrap"><img src="assets/youssef-qr-navy.png" alt="QR code" /></div>

    <div class="scan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><line x1="14" y1="14" x2="14" y2="17"/><line x1="17" y1="14" x2="21" y2="14"/><line x1="21" y1="14" x2="21" y2="21"/><line x1="14" y1="21" x2="18" y2="21"/></svg>
      SCAN ME
    </div>
    <div class="scan-sub">Open my digital card · save my contact</div>

    <div class="contact-strip">
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.55 9.81a19.79 19.79 0 01-3.07-8.67A2 2 0 012.46 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 9.43a16 16 0 006.66 6.66l.8-.8a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>+20 111 564 3691</span>
      <span class="dot"></span>
      <span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2m5.8 14.01c-.24.68-1.42 1.31-1.96 1.36-.5.05-.95.24-3.2-.67-2.7-1.09-4.42-3.86-4.55-4.04-.13-.18-1.1-1.46-1.1-2.79 0-1.32.69-1.97.94-2.24.24-.27.53-.34.71-.34.18 0 .35.01.5.01.16.01.38-.06.59.45.24.58.81 2 .88 2.14.07.14.12.31.02.49-.09.18-.14.29-.28.45-.14.16-.29.36-.42.48-.14.13-.28.28-.12.55.16.27.71 1.17 1.53 1.9 1.05.94 1.94 1.23 2.21 1.37.27.14.43.12.59-.07.16-.18.68-.79.86-1.07.18-.27.36-.22.61-.13.24.09 1.55.73 1.81.86.27.13.45.2.51.31.07.11.07.63-.17 1.31"/></svg>WhatsApp</span>
    </div>
  </div>

  <script>
    // Scale the fixed-size poster so the whole thing always fits the screen
    (function () {
      var poster = document.querySelector('.poster');
      function fit() {
        var vw = window.innerWidth;
        var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
        var scale = Math.min(vw / 1080, vh / 1920);
        poster.style.transform = 'scale(' + scale + ')';
      }
      fit();
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
    })();
  </script>
</body>
</html>
